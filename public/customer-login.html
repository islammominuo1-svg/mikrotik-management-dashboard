<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef4f7">
  <title>Customer Login · ISP Home Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="customer-login.css">
</head>
<body>
  <main class="login-shell">
    <a class="brand" href="/customer-login.html"><span class="brand-mark">⌁</span><span>ISP Home Connect</span></a>
    <section class="login-card">
      <div class="login-icon">⌂</div>
      <p class="eyebrow">CUSTOMER PORTAL</p>
      <h1>Welcome back</h1>
      <p class="intro">Sign in to view your internet plan, bill and account details.</p>
      <form id="customerLoginForm">
        <label for="customerUsername">PPPoE Username</label>
        <input id="customerUsername" name="username" type="text" autocomplete="username" placeholder="Enter your username" required>
        <label for="customerPassword">Password</label>
        <div class="password-wrap"><input id="customerPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button type="button" id="togglePassword" aria-label="Show password">Show</button></div>
        <div id="loginMessage" class="message hidden" role="alert"></div>
        <button id="signInButton" class="submit-button" type="submit"><span>Sign in</span><span aria-hidden="true">→</span></button>
      </form>
      <p class="help-text">Use the PPPoE username and password provided by your reseller.</p>
    </section>
    <a class="staff-link" href="/login.html">Admin or reseller? Open the management login</a>
  </main>
  <script src="customer-login.js"></script>
</body>
</html>
