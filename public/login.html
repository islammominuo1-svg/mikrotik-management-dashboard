<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>লগইন পোর্টাল | MikroTik Management Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07121b;
      --panel: #111d27;
      --panel-card: #152432;
      --border: #2a3c4a;
      --border-focus: #38a5e8;
      --soft: #e2edf5;
      --muted: #8ea5b5;
      --primary: #258ece;
      --primary-hover: #1c76ad;
      --danger: #e25858;
      --danger-bg: rgba(226, 88, 88, 0.12);
      --success: #28b877;
      --success-bg: rgba(40, 184, 119, 0.12);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 20%, #152d42 0%, #091521 50%, #050d14 100%);
      color: var(--soft);
      font-family: "Hind Siliguri", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: rgba(17, 29, 39, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 30px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(37, 142, 206, 0.12);
      position: relative;
      overflow: hidden;
    }
    .login-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #258ece, #38c8b0, #258ece);
    }

    /* Role Switcher */
    .role-switcher {
      display: flex;
      background: #0c1620;
      border: 1px solid #243543;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
      gap: 4px;
    }
    .role-btn {
      flex: 1;
      background: none;
      border: none;
      color: #8da2b1;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.2s ease;
    }
    .role-btn:hover {
      color: #e4edf4;
    }
    .role-btn.active {
      background: #258ece;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 142, 206, 0.4);
    }
    .role-btn.active.admin-mode {
      background: linear-gradient(135deg, #2481b7, #1f6493);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(37, 142, 206, 0.25), rgba(40, 184, 119, 0.15));
      border: 1px solid rgba(56, 165, 232, 0.35);
      font-size: 26px;
      color: #55b6f3;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.3s;
    }
    .brand-header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: #f1f7fc;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }
    .brand-header p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .auth-form {
      display: grid;
      gap: 18px;
    }
    .input-group {
      display: grid;
      gap: 7px;
    }
    .input-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #c9dbe7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 13px;
      color: #698294;
      font-size: 16px;
      pointer-events: none;
    }
    .input-wrapper input {
      width: 100%;
      background: #0d1822;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 14px 12px 40px;
      color: #ffffff;
      font-size: 0.98rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .input-wrapper input:focus {
      outline: none;
      border-color: var(--border-focus);
      background: #101d29;
      box-shadow: 0 0 0 3px rgba(37, 142, 206, 0.22);
    }
    .input-wrapper input::placeholder {
      color: #5b7181;
    }
    .toggle-pass {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #728c9e;
      cursor: pointer;
      font-size: 14px;
      padding: 4px 6px;
      border-radius: 4px;
      line-height: 1;
    }
    .toggle-pass:hover {
      color: #b2c9d8;
    }
    .submit-btn {
      width: 100%;
      background: linear-gradient(180deg, #2b99dd 0%, #1f7cb8 100%);
      border: 1px solid #3ca8eb;
      color: #ffffff;
      padding: 13px 18px;
      border-radius: 9px;
      font-size: 1.02rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 6px;
      box-shadow: 0 6px 16px rgba(31, 124, 184, 0.35);
      transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
    }
    .submit-btn:hover {
      background: linear-gradient(180deg, #32a4ea 0%, #2387c7 100%);
      box-shadow: 0 8px 22px rgba(31, 124, 184, 0.45);
    }
    .submit-btn:active {
      transform: scale(0.99);
    }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .status-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      line-height: 1.5;
      margin-top: 14px;
    }
    .status-alert.error {
      display: block;
      background: var(--danger-bg);
      border: 1px solid rgba(226, 88, 88, 0.35);
      color: #fca8a8;
    }
    .status-alert.success {
      display: block;
      background: var(--success-bg);
      border: 1px solid rgba(40, 184, 119, 0.35);
      color: #8ae4b5;
    }
    .footer-note {
      text-align: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.82rem;
      color: #728796;
    }
    .customer-portal-link { display:block; margin:14px 0 0; text-align:center; color:#78c9f3; font-size:.84rem; font-weight:600; text-decoration:none; }
    .customer-portal-link:hover { color:#b5e7ff; text-decoration:underline; }
  </style>
</head>
<body>

  <main class="login-container">
    <!-- Role Switcher -->
    <div class="role-switcher">
      <button type="button" class="role-btn active" data-role="reseller" id="btnRoleReseller">
        <span>👥</span> রিসেলার পোর্টাল
      </button>
      <button type="button" class="role-btn" data-role="admin" id="btnRoleAdmin">
        <span>🛡️</span> অ্যাডমিন লগইন
      </button>
    </div>

    <header class="brand-header">
      <div class="logo-badge" id="portalBadgeIcon">◒</div>
      <h1 id="portalTitle">রিসেলার পোর্টাল লগইন</h1>
      <p id="portalSubtitle">MikroTik RouterOS Management • Reseller Access</p>
    </header>

    <form id="loginForm" class="auth-form" novalidate>
      <div class="input-group">
        <label for="loginUsername" id="lblUsername">ব্যবহারকারীর নাম (Username)</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input 
            type="text" 
            id="loginUsername" 
            name="username" 
            required 
            placeholder="আপনার ইউজারনেম দিন" 
            autocomplete="username"
            autofocus
          >
        </div>
      </div>

      <div class="input-group">
        <label for="loginPassword">পাসওয়ার্ড (Password)</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input 
            type="password" 
            id="loginPassword" 
            name="password" 
            required 
            placeholder="আপনার পাসওয়ার্ড দিন" 
            autocomplete="current-password"
          >
          <button type="button" class="toggle-pass" id="togglePassBtn" aria-label="Toggle password visibility">👁️</button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">
        <span id="submitBtnText">লগইন করুন</span>
        <span aria-hidden="true">→</span>
      </button>

      <div id="statusAlert" class="status-alert" role="alert"></div>
    </form>

    <a class="customer-portal-link" href="/customer-login.html">PPPoE User Login</a>

    <footer class="footer-note">
      নিরাপদ RouterOS পোর্টাল • অ্যাকাউন্ট সংক্রান্ত সহায়তার জন্য অ্যাডমিনের সাথে যোগাযোগ করুন।
    </footer>
  </main>

  <script>
    let currentRole = "admin";

    const alertEl = document.getElementById("statusAlert");
    const form = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");
    const submitBtnText = document.getElementById("submitBtnText");
    const passInput = document.getElementById("loginPassword");
    const togglePassBtn = document.getElementById("togglePassBtn");
    const portalTitle = document.getElementById("portalTitle");
    const portalSubtitle = document.getElementById("portalSubtitle");
    const portalBadgeIcon = document.getElementById("portalBadgeIcon");
    const btnReseller = document.getElementById("btnRoleReseller");
    const btnAdmin = document.getElementById("btnRoleAdmin");

    // Check if URL has ?role=admin
    const urlParams = new URLSearchParams(window.location.search);
    setRole(urlParams.get("role") === "reseller" ? "reseller" : "admin");

    function setRole(role) {
      currentRole = role;
      clearAlert();

      if (role === "admin") {
        btnAdmin.classList.add("active", "admin-mode");
        btnReseller.classList.remove("active");
        portalBadgeIcon.textContent = "🛡️";
        portalTitle.textContent = "সিস্টেম অ্যাডমিন লগইন";
        portalSubtitle.textContent = "MikroTik RouterOS Management • Admin Portal";
        submitBtnText.textContent = "অ্যাডমিন হিসেবে লগইন করুন";
      } else {
        btnReseller.classList.add("active");
        btnAdmin.classList.remove("active", "admin-mode");
        portalBadgeIcon.textContent = "◒";
        portalTitle.textContent = "রিসেলার পোর্টাল লগইন";
        portalSubtitle.textContent = "MikroTik RouterOS Management • Reseller Access";
        submitBtnText.textContent = "রিসেলার হিসেবে লগইন করুন";
      }
    }

    btnReseller.addEventListener("click", () => setRole("reseller"));
    btnAdmin.addEventListener("click", () => setRole("admin"));

    togglePassBtn.addEventListener("click", () => {
      const isPass = passInput.type === "password";
      passInput.type = isPass ? "text" : "password";
      togglePassBtn.textContent = isPass ? "🙈" : "👁️";
    });

    function showAlert(msg, type = "error") {
      alertEl.textContent = msg;
      alertEl.className = "status-alert " + type;
      alertEl.style.display = "block";
    }

    function clearAlert() {
      alertEl.textContent = "";
      alertEl.className = "status-alert";
      alertEl.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();

      const username = document.getElementById("loginUsername").value.trim();
      const password = passInput.value;

      if (!username || !password) {
        showAlert("অনুগ্রহ করে ইউজারনেম এবং পাসওয়ার্ড প্রদান করুন।", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtnText.textContent = "যাচাই করা হচ্ছে...";

      const endpoint = currentRole === "admin" ? "/api/admin/login" : "/api/reseller/login";

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          if (res.status === 403 || (data.error && data.error.includes("inactive"))) {
            throw new Error("আপনার অ্যাকাউন্টটি বর্তমানে নিষ্ক্রিয় (ডিঅ্যাক্টিভ) রয়েছে।");
          }
          if (res.status === 401) {
            throw new Error(currentRole === "admin" ? "ভুল অ্যাডমিন ইউজারনেম বা পাসওয়ার্ড।" : "ভুল রিসেলার ইউজারনেম বা পাসওয়ার্ড।");
          }
          throw new Error(data.error || "লগইন ব্যর্থ হয়েছে। সার্ভারে সমস্যা হতে পারে।");
        }

        if (currentRole === "admin") {
          // Store admin session
          const adminSession = {
            id: data.admin?.id,
            username: data.admin?.username,
            fullName: data.admin?.fullName || data.admin?.username,
            email: data.admin?.email,
            role: "admin",
            sessionToken: data.sessionToken,
            isActive: true,
            loggedInAt: new Date().toISOString()
          };
          localStorage.setItem("userSession", JSON.stringify(adminSession));
          localStorage.setItem("adminSession", JSON.stringify(adminSession));
          localStorage.removeItem("resellerSession");
        } else {
          // Store reseller session
          const resellerSession = {
            id: data.reseller?.id,
            username: data.reseller?.username,
            fullName: data.reseller?.fullName || data.reseller?.username,
            mobile: data.reseller?.mobile || "",
            email: data.reseller?.email || "",
            zone: data.reseller?.zone || "",
            role: "reseller",
            sessionToken: data.sessionToken,
            isActive: data.reseller?.isActive !== false,
            permissions: data.permissions || ["ppp_user_create_only"],
            loggedInAt: new Date().toISOString()
          };
          localStorage.setItem("userSession", JSON.stringify(resellerSession));
          localStorage.setItem("resellerSession", JSON.stringify(resellerSession));
          localStorage.removeItem("adminSession");
        }

        showAlert("লগইন সফল হয়েছে! ড্যাশবোর্ডে প্রবেশ করা হচ্ছে...", "success");
        setTimeout(() => {
          window.location.href = "/index.html";
        }, 500);

      } catch (err) {
        showAlert(err.message, "error");
        submitBtn.disabled = false;
        submitBtnText.textContent = currentRole === "admin" ? "অ্যাডমিন হিসেবে লগইন করুন" : "রিসেলার হিসেবে লগইন করুন";
      }
    });
  </script>
</body>
</html>
